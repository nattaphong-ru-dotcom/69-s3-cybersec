services:
  db:
    image: postgres:16-alpine
    container_name: 69-s3-db
    ports:
      - "127.0.0.1:54327:5432"
    environment:
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_DB=${DATABASE_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  admin:
    image: dpage/pgadmin4
    container_name: 69-s3-admin
    ports:
      - "127.0.0.1:8083:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - db
    restart: unless-stopped

  app:
    image: prawee/strapi
    container_name: my_app
    ports:
      - "127.0.0.1:8080:1337"
    environment:
      - DATABASE_CLIENT=${DATABASE_CLIENT:-postgres}
      - DATABASE_NAME=${DATABASE_DB}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
    volumes:
      # โค้ด content-type อยู่ใน repo (bind mount) ไม่ใช่ใน image
      # แก้ที่ strapi-src/api/<ชื่อ>/ แล้ว restart ได้เลย ไม่หายตอน recreate
      #
      # ข้อควรระวัง: bind mount ทับทั้งไดเรกทอรี ต้องมี content-types/ routes/ services/
      # ครบทุกตัว ถ้าโฟลเดอร์ไหนไม่ครบ Strapi จะมองว่าไม่รู้จัก content-type นั้น
      # แล้วลบตารางทิ้งตอน schema sync (ข้อมูลหายถาวร)
      # วิธีเพิ่ม content-type ใหม่: copy ทั้งโฟลเดอร์ออกจาก image มาก่อน แล้วค่อยแก้
      - ./strapi-src/api/student:/opt/app/src/api/student:ro
      - ./strapi-src/api/subject:/opt/app/src/api/subject:ro
      - ./strapi-src/api/teacher:/opt/app/src/api/teacher:ro
      - ./strapi-src/api/mapping:/opt/app/src/api/mapping:ro
    depends_on:
      - db
    restart: unless-stopped

  admin-init:
    image: docker.io/curlimages/curl:latest
    container_name: 69-s3-admin-init
    depends_on:
      - app
    environment:
      - STRAPI_URL=http://app:1337
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - AUTO_CREATE_ADMIN=${AUTO_CREATE_ADMIN:-false}
    volumes:
      - ./scripts/ensure-admin.sh:/ensure-admin.sh:ro
    entrypoint: ["/bin/sh", "/ensure-admin.sh"]
    restart: "no"

volumes:
  postgres_data: